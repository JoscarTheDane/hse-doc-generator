<style>
  #hse-form { max-width: 560px; margin: 2rem auto; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #e0e0e0; }
  #hse-form .dropzone { border: 2px dashed #333; border-radius: 12px; padding: 2.5rem 1.5rem; text-align: center; cursor: pointer; transition: all 0.2s; margin-bottom: 1.5rem; background: #141414; }
  #hse-form .dropzone:hover, #hse-form .dropzone.dragover { border-color: #4ade80; background: rgba(74, 222, 128, 0.05); }
  #hse-form .dropzone.has-file { border-color: #4ade80; border-style: solid; }
  #hse-form .dropzone-text { color: #888; font-size: 0.875rem; }
  #hse-form .dropzone-text strong { color: #ccc; }
  #hse-form .file-name { color: #4ade80; font-size: 0.875rem; margin-top: 0.5rem; display: none; }
  #hse-form .has-file .file-name { display: block; }
  #hse-form .has-file .dropzone-text { display: none; }
  #hse-form .fg { margin-bottom: 1rem; }
  #hse-form label { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: #888; margin-bottom: 0.375rem; }
  #hse-form input, #hse-form textarea { width: 100%; background: #141414; border: 1px solid #2a2a2a; border-radius: 8px; padding: 0.75rem 1rem; color: #e0e0e0; font-size: 0.9375rem; box-sizing: border-box; }
  #hse-form input:focus, #hse-form textarea:focus { outline: none; border-color: #4ade80; }
  #hse-form textarea { resize: vertical; min-height: 80px; }
  #hse-form button { width: 100%; padding: 0.875rem; background: #4ade80; color: #0a0a0a; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; margin-top: 0.5rem; font-size: 1rem; transition: opacity 0.2s; }
  #hse-form button:hover { opacity: 0.9; }
  #hse-form button:disabled { opacity: 0.4; cursor: not-allowed; }
  #hse-form .status { margin-top: 1rem; padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.875rem; display: none; }
  #hse-form .ok { display: block; background: rgba(74, 222, 128, 0.1); border: 1px solid rgba(74, 222, 128, 0.3); color: #4ade80; }
  #hse-form .err { display: block; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #ef4444; }
  #hse-form .loading { display: block; background: rgba(255, 255, 255, 0.05); border: 1px solid #2a2a2a; color: #888; }
  #hse-form .file-list { margin-top: 0.5rem; text-align: left; font-size: 0.8rem; color: #aaa; }
  #hse-form .file-list span { display: block; padding: 0.15rem 0; }
</style>

<div id="hse-form">
  <p style="color:#888;font-size:0.875rem;margin-bottom:1.5rem;">
    Upload your scope documents and we'll generate your HSE deliverables. Results emailed back to you.
  </p>

  <!-- Honeypot field for spam prevention -->
  <div style="position:absolute;left:-9999px" aria-hidden="true">
    <input type="text" id="website" tabindex="-1" autocomplete="off">
  </div>

  <div class="dropzone" id="dropzone">
    <div class="dropzone-text">Drop files here or <strong>browse</strong></div>
    <div class="file-name" id="fileCount"></div>
    <div class="file-list" id="fileList"></div>
    <input type="file" id="fileInput" style="display:none" multiple>
  </div>

  <div class="fg">
    <label for="client">Client Name</label>
    <input type="text" id="client" placeholder="e.g. Shell, ExxonMobil, TotalEnergies">
  </div>
  <div class="fg">
    <label for="company">Your Company</label>
    <input type="text" id="company" placeholder="Your company name">
  </div>
  <div class="fg">
    <label for="notes">Scope / Notes</label>
    <textarea id="notes" placeholder="Scope of work, special conditions, hazards to consider..."></textarea>
  </div>
  <div class="fg">
    <label for="email">Your Email</label>
    <input type="email" id="email" placeholder="you@company.com">
  </div>

  <button id="submitBtn">Submit Request</button>
  <div id="status" class="status"></div>
</div>

<script>
  const INBOX = "consultingsubsea@agentmail.to";
  const CC = "technical@consultingsubsea.com";
  const KEY = "am_us_inbox_e350980ca4cdbe94027f3794eb452aa4963084d1a7642d60d2b7be6a0ba7ea99";

  const dz = document.getElementById('dropzone');
  const fi = document.getElementById('fileInput');
  const fc = document.getElementById('fileCount');
  const fl = document.getElementById('fileList');
  let uploadedFiles = [];

  dz.onclick = () => fi.click();
  dz.ondragover = e => { e.preventDefault(); dz.classList.add('dragover'); };
  dz.ondragleave = () => dz.classList.remove('dragover');
  dz.ondrop = e => {
    e.preventDefault();
    dz.classList.remove('dragover');
    if (e.dataTransfer.files.length) {
      addFiles(e.dataTransfer.files);
    }
  };
  fi.onchange = () => {
    if (fi.files.length) addFiles(fi.files);
  };

  function addFiles(newFiles) {
    for (let f of newFiles) uploadedFiles.push(f);
    renderFileList();
  }

  function renderFileList() {
    if (uploadedFiles.length) {
      dz.classList.add('has-file');
      fc.textContent = uploadedFiles.length + ' file(s) selected';
      fl.innerHTML = uploadedFiles.map(f => '<span>&#128196; ' + f.name + '</span>').join('');
    } else {
      dz.classList.remove('has-file');
      fc.textContent = '';
      fl.innerHTML = '';
    }
  }

  document.getElementById('submitBtn').onclick = async () => {
    const btn = document.getElementById('submitBtn');
    const st = document.getElementById('status');

    // Honeypot: if spam bot filled it, just say success
    if (document.getElementById('website').value) {
      st.className = 'status ok';
      st.textContent = 'Request sent!';
      return;
    }

    const client = document.getElementById('client').value.trim();
    const company = document.getElementById('company').value.trim();
    const email = document.getElementById('email').value.trim();
    const notes = document.getElementById('notes').value.trim();

    if (!client || !company || !email) {
      st.className = 'status err';
      st.textContent = 'Please fill in client, company, and your email address.';
      return;
    }

    if (!uploadedFiles.length) {
      st.className = 'status err';
      st.textContent = 'Please upload at least one file.';
      return;
    }

    btn.disabled = true;
    st.className = 'status loading';
    st.textContent = 'Uploading ' + uploadedFiles.length + ' file(s) — please wait...';

    // Format today's date as DD-MMM-YYYY
    const now = new Date();
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const dateStr = String(now.getDate()).padStart(2,'0') + '-' + months[now.getMonth()] + '-' + now.getFullYear();
    // Sanitised company slug for folder name
    const slug = company.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'client';
    const folderName = slug + '-' + dateStr;

    let attachments = [];
    for (let f of uploadedFiles) {
      const reader = new FileReader();
      reader.readAsDataURL(f);
      await new Promise(r => { reader.onload = r; });
      attachments.push({
        filename: f.name,
        content_type: f.type || 'application/octet-stream',
        content: reader.result.split(',')[1]
      });
    }

    const fileListStr = uploadedFiles.map(f => '- ' + f.name).join('\n');

    // Build the self-instructing email body
    const bodyTemplate = [
      'LOAD SKILL: hse-risk-assessment-generator',
      'LOAD SKILL: air-diving-operations',
      '',
      '=== AGENT WORKFLOW ===',
      'You have received an HSE request via the ConsultingSubsea website form.',
      'Your job: generate a 3-sheet HIRA Excel workbook and email it back to the requester.',
      '',
      '=== PROCESSING STEPS ===',
      '1. Create project folder: ~/hse-projects/' + folderName + '/',
      '2. Save all attachments to that folder',
      '3. Read each attachment and extract work phases/tasks',
      '4. Build a 12-column HIRA with these columns:',
      '   No. | Task/Activity | Hazard | Threats/Scenario | Top Event & Consequence | P | S | RP | RS | Existing Controls/RRMs | Recovery Measures | Action Party',
      '5. Use 5x5 risk matrix (P x S = R, 1-25)',
      '   - Red = Extreme (15-25)',
      '   - Orange = High (9-12)',
      '   - Yellow = Medium (3-6)',
      '   - Green = Low (1-2)',
      '6. Use air-diving-operations skill for diving-specific hazards',
      '7. Cite relevant IMCA refs (D010, D018, D078, D058, D084, LR006, IOGP 411)',
      '8. Generate formatted Excel workbook with 3 sheets: HIRA, RAM Summary, Attendance',
      '9. Save workbook as: ~/hse-projects/' + folderName + '/' + folderName + '_HIRA.xlsx',
      '10. EMAIL the completed workbook to: ' + email,
      '11. CC all outbound emails to: ' + CC,
      '12. Confirm output file path and email sent in your response',
      '',
      '=== ATTACHED FILES ===',
      fileListStr,
      '',
      '=== PROJECT DETAILS ===',
      'CLIENT: ' + client,
      'CONTRACTOR: ' + company,
      'DATE: ' + dateStr,
      'SCOPE/NOTES: ' + (notes || '(none)'),
      'CONTACT EMAIL: ' + email,
      '',
      'Proceed step by step: create folder → save attachments → read documents → extract tasks → identify hazards → score risk → define controls → generate Excel → email back.'
    ].join('\n');

    try {
      const r = await fetch('https://api.agentmail.to/v0/inboxes/' + INBOX + '/messages/send', {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + KEY,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          to: INBOX,
          cc: [CC],
          subject: 'HSE Request: ' + client + ' / ' + company,
          text: bodyTemplate
        })
      });

      if (r.ok) {
        st.className = 'status ok';
        st.textContent = 'Request received! We will process it and email the completed HIRA workbook to you shortly.';
        document.getElementById('client').value = '';
        document.getElementById('company').value = '';
        document.getElementById('notes').value = '';
        document.getElementById('email').value = '';
        uploadedFiles = [];
        renderFileList();
      } else {
        const d = await r.json();
        throw new Error(d.message || 'Send failed');
      }
    } catch(e) {
      st.className = 'status err';
      st.textContent = 'Could not send. Please email us directly at ' + INBOX + ' with your details.';
    } finally {
      btn.disabled = false;
    }
  };
</script>
